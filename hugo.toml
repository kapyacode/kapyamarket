baseURL = "https://www.kapyamarket.co.za/"
title = "Kapya Market"
theme = "PaperMod"

[permalinks.page]
posts = "/:year/:month/:slug.html"
pages = "/p/:slug.html"

[outputs]
home = ["HTML", "RSS"]

[markup.goldmark.renderer]
unsafe = true

[params]
defaultTheme = "light"
ShowReadingTime = true
ShowShareButtons = false
ShowBreadCrumbs = false
ShowPostNavLinks = true
ShowToc = true

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Start Here"
url = "/p/start-here.html"
weight = 2

[[menu.main]]
name = "About"
url = "/p/about.html"
weight = 3

[[menu.main]]
name = "Contact"
url = "/p/contact-us.html"
weight = 4

[security]
  allowContent = ['! ^text/org$']

[params.homeInfoParams]
Title = "Welcome to Kapya Market"
Content = "Practical guides on affiliate marketing, blogging and building an online business in South Africa."

[params.label]
text = "Kapya Market"
