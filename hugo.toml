locale = "en-ZA"
baseURL = "https://www.kapyamarket.co.za/"
title = "Kapya Market"
theme = "PaperMod"

[permalinks.page]
posts = "/:year/:month/:slug/"
pages = "/p/:slug/"

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
unsafe = true

[params]
  description = "Practical guides on affiliate marketing, blogging, web hosting and online business for beginners in South Africa."
  author = "Kapya Market"
  images = ["/images/og-default.png"]
defaultTheme = "light"
ShowReadingTime = true
ShowShareButtons = false
ShowBreadCrumbs = false
ShowPostNavLinks = true
ShowToc = true

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Start Here"
url = "/p/start-here/"
weight = 2

[[menu.main]]
name = "About"
url = "/p/about/"
weight = 3

[[menu.main]]
name = "Contact"
url = "/p/contact-us/"
weight = 4

[security]
  allowContent = ['! ^text/org$']

[params.homeInfoParams]
Title = "Welcome to Kapya Market"
Content = '<p class="hero-tag">Practical guides on affiliate marketing, blogging and building an online business in South Africa.</p><p class="hero-actions"><a class="hero-btn hero-btn-main" href="/p/start-here/">Start here</a> <a class="hero-btn hero-btn-alt" href="/p/about/">About us</a></p>'

[params.label]
text = "Kapya Market"
icon = "/kapya-logo.svg"
iconHeight = 34

[params.assets]
  favicon = "/favicon.ico"
  favicon16x16 = "/favicon-16x16.png"
  favicon32x32 = "/favicon-32x32.png"
  apple_touch_icon = "/apple-touch-icon.png"

[[menu.main]]
name = "Search"
url = "/search/"
weight = 5
